<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Asistente Inteligente</title>
    <!-- Metadatos para privacidad y SEO -->
    <meta name="description" content="AURA - Asistente inteligente con IA. Conversaciones anónimas y privadas. Sin registro, sin historial.">
    <meta name="keywords" content="IA, asistente, chat, inteligencia artificial, privado, anónimo">
    <meta name="author" content="AURA Assistant">
    <meta name="robots" content="index, follow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0A0A0F;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Fondo animado */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, #0A0A0F, #05070A);
            z-index: -2;
        }
        
        .bg-animated::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59,130,246,0.08), transparent 50%);
            animation: rotate 25s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(59,130,246,0.08), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        
        .app { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 320px;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        
        .sidebar.collapsed { width: 0; opacity: 0; }
        
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: #1E293B; }
        .sidebar::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 10px; }
        
        .toggle-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px;
            transition: all 0.2s;
            color: white;
        }
        
        .toggle-btn:hover { background: rgba(59, 130, 246, 0.4); transform: scale(1.05); }
        
        .floating-toggle {
            position: fixed;
            left: 15px;
            top: 20px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
            transition: all 0.2s;
        }
        
        .floating-toggle:hover { transform: scale(1.05); }
        
        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .logo-icon {
            font-size: 36px;
            position: relative;
            animation: rayoPulse 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 5px #3B82F6);
            display: inline-block;
        }
        
        @keyframes rayoPulse {
            0% { filter: drop-shadow(0 0 2px #3B82F6); transform: scale(1) rotate(0deg); }
            50% { filter: drop-shadow(0 0 20px #F59E0B) drop-shadow(0 0 5px #8B5CF6); transform: scale(1.05) rotate(5deg); }
            100% { filter: drop-shadow(0 0 2px #3B82F6); transform: scale(1) rotate(0deg); }
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #60A5FA, #A78BFA, #F59E0B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .section { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .section-title { font-size: 10px; color: #64748B; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        
        /* Barra de conexión */
        .connection-bar { height: 4px; background: rgba(59,130,246,0.2); border-radius: 2px; overflow: hidden; margin-top: 10px; }
        .connection-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #3B82F6, #8B5CF6, #F59E0B); transition: width 0.5s; border-radius: 2px; position: relative; overflow: hidden; }
        .connection-fill::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); animation: shine 2s infinite; }
        @keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        
        /* Botón Nuevo Chat */
        .new-chat-btn {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border: none;
            border-radius: 30px;
            padding: 12px 16px;
            margin: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 10px rgba(59,130,246,0.2);
        }
        
        .new-chat-btn:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(59,130,246,0.4); }
        
        /* Selector de voz */
        .voice-select {
            width: 100%;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 10px 12px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }
        
        .voice-select:hover { border-color: #3B82F6; }
        .voice-select:focus { border-color: #3B82F6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        
        /* Badge de voz */
        .voice-badge {
            background: rgba(139,92,246,0.15);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 30px;
            padding: 10px 16px;
            margin: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #A78BFA;
            transition: all 0.2s;
        }
        
        .voice-badge.speaking {
            background: rgba(59,130,246,0.25);
            border-color: #3B82F6;
            color: #60A5FA;
            animation: voicePulse 1s infinite;
        }
        
        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 5px #3B82F6; }
            50% { box-shadow: 0 0 15px #8B5CF6; }
        }
        
        /* Botón de donación */
        .donate-support-btn {
            background: linear-gradient(135deg, #0070BA, #003087);
            border: none;
            border-radius: 30px;
            padding: 12px;
            margin: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            width: calc(100% - 40px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,48,135,0.3);
        }
        
        .donate-support-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .donate-support-btn:hover::before { left: 100%; }
        .donate-support-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0,48,135,0.5);
        }
        
        /* Chat principal */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: rgba(10, 12, 18, 0.4); }
        
        .chat-header {
            padding: 18px 28px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }
        
        .chat-header h2 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #60A5FA);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Área de mensajes */
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: #1E293B; }
        .chat-messages::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 10px; }
        
        /* Mensajes */
        .message { margin-bottom: 24px; position: relative; animation: fadeIn 0.3s ease; }
        .message.user { text-align: right; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-content {
            display: inline-block;
            max-width: 70%;
            background: rgba(30, 35, 50, 0.9);
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
        }
        
        .message-time {
            font-size: 10px;
            color: #94A3B8;
            margin-top: 6px;
            display: block;
        }
        
        .message-actions {
            position: absolute;
            bottom: -28px;
            right: 0;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            gap: 8px;
        }
        
        .message:hover .message-actions { opacity: 1; }
        
        .copy-btn {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            color: #94A3B8;
            transition: all 0.2s;
        }
        
        .copy-btn:hover { background: #3B82F6; color: white; border-color: #3B82F6; }
        
        /* Pensando */
        .thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(30, 35, 50, 0.8);
            border-radius: 24px;
            width: fit-content;
            margin-bottom: 20px;
        }
        
        .thinking-dots { display: flex; gap: 5px; }
        .thinking-dots span {
            width: 8px;
            height: 8px;
            background: #60A5FA;
            border-radius: 50%;
            animation: wave 1.2s infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        
        .thinking-text { font-size: 13px; color: #94A3B8; }
        
        /* Input */
        .chat-input {
            padding: 20px 24px 24px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            border-top: 1px solid #334155;
        }
        
        .input-container {
            display: flex;
            gap: 12px;
            background: #1E293B;
            border-radius: 48px;
            padding: 4px;
            border: 1px solid #334155;
            transition: all 0.2s;
        }
        
        .input-container:focus-within { border-color: #3B82F6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        
        .chat-input input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 13px 18px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        
        .chat-input input::placeholder { color: #64748B; }
        
        .chat-input button {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .chat-input button:hover { transform: scale(1.02); }
        
        .footer {
            padding: 12px;
            text-align: center;
            font-size: 10px;
            color: #475569;
            border-top: 1px solid rgba(255,255,255,0.03);
        }
        
        /* Aviso de privacidad */
        .privacy-note {
            font-size: 9px;
            text-align: center;
            padding: 8px;
            color: #475569;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    <div class="glow"></div>

    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="toggle-btn" id="toggleSidebar">◀</div>
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">AURA</span>
            </div>
            
            <div class="section">
                <div class="section-title">CONEXIÓN</div>
                <div class="connection-bar">
                    <div class="connection-fill" id="connectionFill"></div>
                </div>
            </div>
            
            <button class="new-chat-btn" id="newChatBtn">
                <span>➕</span> Nuevo Chat
            </button>
            
            <div class="section">
                <div class="section-title">🎤 VOZ</div>
                <select id="voiceSelect" class="voice-select">
                    <option value="sin_voz">🔇 Sin Voz</option>
                </select>
            </div>
            
            <button class="donate-support-btn" id="donateSupportBtn">
                <span>💙</span> Apoyar el desarrollo
            </button>
            
            <div class="voice-badge" id="voiceBadge">
                <span>🔇</span> VOZ DESACTIVADA
            </div>
            
            <div class="footer">
                ⚡ AURA - Asistente Inteligente
            </div>
            <div class="privacy-note">
                🔒 Conversaciones anónimas y privadas. No se guarda ningún dato.
            </div>
        </div>
        
        <button class="floating-toggle" id="floatingToggle">▶</button>
        
        <!-- Chat principal -->
        <div class="main-chat">
            <div class="chat-header">
                <h2>✨ Conversación con AURA</h2>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">
                        ✨ Hola, soy AURA. ¿En qué puedo ayudarte?
                        <span class="message-time">Ahora</span>
                    </div>
                </div>
            </div>
            
            <div class="chat-input">
                <div class="input-container">
                    <input type="text" id="chatInput" placeholder="Escribe tu mensaje...">
                    <button id="sendBtn">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN - SIN MEMORIA, 100% ANÓNIMO
        // ============================================
        let voces = [], vozSel = null;
        let vozActiva = false;
        let interactionCount = 0;
        
        // SIN localStorage - no se guarda nada
        // SIN nombre de usuario - completamente anónimo
        
        const PAYPAL_DONATION_URL = "https://www.paypal.com/ncp/payment/BW82NQZVAH2UQ";
        
        // ============================================
        // FUNCIONES DEL CHAT (SIN HISTORIAL)
        // ============================================
        function addMessage(text, isUser = false) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            const ahora = new Date();
            const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            div.innerHTML = `
                <div class="message-content">
                    ${text}
                    <span class="message-time">${hora}</span>
                </div>
                <div class="message-actions">
                    <button class="copy-btn" onclick="copiarMensaje(this)">📋 Copiar</button>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            
            if (!isUser) {
                interactionCount++;
                let nivel = Math.min(100, interactionCount * 3);
                document.getElementById('connectionFill').style.width = nivel + '%';
            }
        }
        
        function copiarMensaje(btn) {
            const msg = btn.closest('.message').querySelector('.message-content').innerText;
            navigator.clipboard.writeText(msg);
            btn.innerHTML = '✅ Copiado';
            setTimeout(() => btn.innerHTML = '📋 Copiar', 2000);
        }
        
        function reiniciarChat() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            interactionCount = 0;
            document.getElementById('connectionFill').style.width = '0%';
            
            addMessage("✨ Hola, soy AURA. He reiniciado la conversación. ¿En qué puedo ayudarte?", false);
            if (vozActiva) speak("Hola, he reiniciado la conversación. ¿En qué puedo ayudarte?");
        }
        
        // ============================================
        // DONACIÓN
        // ============================================
        function abrirDonacionPayPal() {
            window.open(PAYPAL_DONATION_URL, '_blank');
            addMessage("💙 Gracias por tu interés en apoyar el desarrollo de AURA.", false);
            if (vozActiva) speak("Gracias por tu interés en apoyar el desarrollo de AURA.");
        }
        
        // ============================================
        // VOZ (sin cambios)
        // ============================================
        function speak(text) {
            if (!text || !vozActiva) return;
            
            let limpio = text.replace(/[\u{1F600}-\u{1F64F}]/gu, '').replace(/\*/g, '').trim();
            if (!limpio) return;
            
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(limpio);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1.05;
            
            if (vozSel && vozSel !== 'sin_voz') utterance.voice = vozSel;
            
            const badge = document.getElementById('voiceBadge');
            badge.classList.add('speaking');
            utterance.onend = () => badge.classList.remove('speaking');
            utterance.onerror = () => badge.classList.remove('speaking');
            
            window.speechSynthesis.speak(utterance);
        }
        
        function cargarVoces() {
            voces = window.speechSynthesis.getVoices();
            const sel = document.getElementById('voiceSelect');
            if (!sel) return;
            
            while (sel.options.length > 1) sel.remove(1);
            
            const vocesEspanol = voces.filter(v => v.lang.startsWith('es'));
            vocesEspanol.forEach(voz => {
                const option = document.createElement('option');
                option.value = voz.name;
                let nombre = voz.name;
                if (nombre.toLowerCase().includes('google')) nombre = '🔵 ' + nombre;
                if (nombre.toLowerCase().includes('microsoft')) nombre = '🟢 ' + nombre;
                if (nombre.toLowerCase().includes('apple')) nombre = '🍎 ' + nombre;
                option.textContent = `${nombre} - ${voz.lang}`;
                sel.appendChild(option);
            });
            
            sel.value = 'sin_voz';
            vozActiva = false;
            vozSel = null;
            const badge = document.getElementById('voiceBadge');
            badge.innerHTML = '🔇 VOZ DESACTIVADA';
            badge.style.opacity = '0.7';
        }
        
        function cambiarVoz() {
            const sel = document.getElementById('voiceSelect');
            const valor = sel.value;
            const badge = document.getElementById('voiceBadge');
            
            if (valor === 'sin_voz') {
                vozActiva = false;
                vozSel = null;
                badge.innerHTML = '🔇 VOZ DESACTIVADA';
                badge.style.opacity = '0.7';
            } else {
                vozActiva = true;
                vozSel = voces.find(v => v.name === valor);
                badge.innerHTML = '🔊 VOZ ACTIVA';
                badge.style.opacity = '1';
            }
        }
        
        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleSidebar');
            const floatingToggle = document.getElementById('floatingToggle');
            const collapsed = sidebar.classList.toggle('collapsed');
            
            toggleBtn.innerHTML = collapsed ? '▶' : '◀';
            floatingToggle.style.display = collapsed ? 'flex' : 'none';
        }
        
        // ============================================
        // ENVIAR MENSAJE (SIN HISTORIAL)
        // ============================================
        async function sendMessage(text) {
            if (!text.trim()) return;
            
            addMessage(text, true);
            document.getElementById('chatInput').value = '';
            
            const container = document.getElementById('chatMessages');
            const thinking = document.createElement('div');
            thinking.className = 'thinking';
            thinking.id = 'thinkingIndicator';
            thinking.innerHTML = `
                <div class="thinking-dots"><span></span><span></span><span></span></div>
                <div class="thinking-text">AURA está pensando...</div>
            `;
            container.appendChild(thinking);
            container.scrollTop = container.scrollHeight;
            
            // Prompt del sistema SIN nombres, SIN memoria, 100% anónimo
            const systemPrompt = `Eres AURA, una asistente amigable, cálida y profesional. 
            No preguntes el nombre del usuario. No guardes información personal. 
            No te inventes datos. Si no sabes algo, dilo honestamente.
            Cada conversación es completamente nueva y anónima.
            Responde en español de forma natural, clara y breve.`;
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer 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',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'deepseek/deepseek-chat',
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        max_tokens: 500,
                        temperature: 0.7
                    })
                });
                
                const thinkingEl = document.getElementById('thinkingIndicator');
                if (thinkingEl) thinkingEl.remove();
                
                if (response.ok) {
                    const data = await response.json();
                    let reply = data.choices[0].message.content;
                    reply = reply.replace(/\*[^*]*\*/g, '').replace(/[\u{1F600}-\u{1F64F}]/gu, '').trim();
                    if (!reply) reply = "Lo siento, no pude procesar tu mensaje.";
                    addMessage(reply, false);
                    speak(reply);
                } else {
                    addMessage("Lo siento, hubo un error. Intenta de nuevo.", false);
                    speak("Lo siento, hubo un error. Intenta de nuevo.");
                }
            } catch (error) {
                const thinkingEl = document.getElementById('thinkingIndicator');
                if (thinkingEl) thinkingEl.remove();
                addMessage("Error de conexión. Verifica tu internet.", false);
                speak("Error de conexión. Verifica tu internet.");
            }
        }
        
        // ============================================
        // INICIALIZACIÓN (SIN CARGA DE HISTORIAL)
        // ============================================
        function init() {
            cargarVoces();
            window.speechSynthesis.onvoiceschanged = cargarVoces;
            
            document.getElementById('toggleSidebar').addEventListener('click', toggleSidebar);
            document.getElementById('floatingToggle').addEventListener('click', toggleSidebar);
            document.getElementById('voiceSelect').addEventListener('change', cambiarVoz);
            document.getElementById('sendBtn').addEventListener('click', () => sendMessage(document.getElementById('chatInput').value));
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage(e.target.value);
            });
            document.getElementById('newChatBtn').addEventListener('click', reiniciarChat);
            document.getElementById('donateSupportBtn').addEventListener('click', abrirDonacionPayPal);
            
            setTimeout(() => {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0;
                window.speechSynthesis.speak(u);
            }, 100);
        }
        
        init();
    </script>
</body>
</html>
